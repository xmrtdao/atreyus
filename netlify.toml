[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so client-side routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# (Optional) proxy API calls to the backend if you host it separately.
# Uncomment and set BACKEND_URL to your backend origin.
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-HOST/api/:splat"
#   status = 200
#   force = true
# [[redirects]]
#   from = "/results/*"
#   to = "https://YOUR-BACKEND-HOST/results/:splat"
#   status = 200
#   force = true